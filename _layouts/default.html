<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | RepQuest</title>
<style>
  :root { --bg: #0b0e1a; --text: #ece7da; --muted: #a9adc4; --accent: #e8bf52; --rule: #2b3558; }
  @media (prefers-color-scheme: light) { :root { --bg: #fbf9f3; --text: #1b1e2c; --muted: #4c5068; --accent: #7a5a00; --rule: #d9d4c4; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  nav { font-size: .95rem; padding-bottom: 1rem; border-bottom: 1px solid var(--rule); margin-bottom: 1.5rem; }
  a { color: var(--accent); }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 .75rem; }
  h2 { font-size: 1.3rem; line-height: 1.3; margin: 2.2rem 0 .6rem; }
  em { color: var(--muted); }
  li { margin: .35rem 0; }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .9rem; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; } th, td { border: 1px solid var(--rule); padding: .4rem .55rem; text-align: left; }
</style>
</head>
<body>
<main>
{% unless page.url == "/" %}<nav><a href="{{ site.baseurl }}/">All RepQuest documents</a></nav>{% endunless %}
{{ content }}
<footer>MujarStudios &middot; <a href="mailto:mujarstudios@gmail.com">mujarstudios@gmail.com</a></footer>
</main>
</body>
</html>
